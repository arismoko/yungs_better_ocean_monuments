[package]
name = "mod-betteroceanmonuments"
version = "0.3.1"
edition = "2024"
license = "LGPL-3.0-only"
description = "YUNG's Better Ocean Monuments for Sunrise: the monument's own tridents stay where they lie"
# Ported from: YUNG's Better Ocean Monuments 1.21.1-NeoForge-4.1.2 (YUNG-GANG/YUNGs-Better-Ocean-Monuments, LGPL-3.0-only). The data files are the upstream mod's own,
# upgraded to 26.3; the Rust is written from the behaviour read in the upstream source.
# Cargo's name and version are not the mod's identity: sunrise-mod.toml is.
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
